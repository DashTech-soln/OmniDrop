name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android APK build type
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true
  workflow_call:
    inputs:
      build_type:
        description: Android APK build type
        type: string
        default: debug
        required: false

env:
  FLUTTER_VERSION: "3.41.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            printf '%s' "$ENCODED_STRING" | base64 --decode > app/android/key.properties
          else
            : > app/android/key.properties
          fi

      - name: Decode android-keystore.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          mkdir -p secrets
          if [ -n "$ENCODED_STRING" ]; then
            printf '%s' "$ENCODED_STRING" | base64 --decode > secrets/android-keystore.jks
          else
            : > secrets/android-keystore.jks
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure release signing key
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.APK_BUILD_DIR }}
        run: |
          if [ ! -s app/android/key.properties ] || [ ! -s secrets/android-keystore.jks ]; then
            echo "Release signing secrets are unavailable; generating an ephemeral CI keystore."
            STORE_PASSWORD=$(openssl rand -hex 24)
            keytool -genkeypair -noprompt -keystore secrets/android-keystore.jks \
              -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" \
              -alias omnidrop-ci -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=OmniDrop CI"
            cat > app/android/key.properties <<EOF
          storeFile=../../secrets/android-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=omnidrop-ci
          keyPassword=$STORE_PASSWORD
          EOF
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build debug APKs
        if: ${{ inputs.build_type != 'release' }}
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --debug --split-per-abi

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          echo "Switching between debug and release builds requires uninstalling the existing app because the signing keys differ."
          flutter build apk --release --split-per-abi

      - name: Verify release APK signatures and ABIs
        if: ${{ inputs.build_type == 'release' }}
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "Verifying signature: $apk"
            "$APKSIGNER" verify --print-certs "$apk"
            echo "Native-code ABIs: $apk"
            "$AAPT" dump badging "$apk" | grep "native-code:"
          done

      - name: Upload debug APKs
        uses: actions/upload-artifact@v6
        if: ${{ inputs.build_type != 'release' }}
        with:
          name: apk-result-debug
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-debug.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v6
        if: ${{ inputs.build_type == 'release' }}
        with:
          name: apk-result-release
          path: ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-*-release.apk
